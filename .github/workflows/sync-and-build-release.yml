name: Sync Upstream Release & Build Docker

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点（北京时间 8 点）运行
  workflow_dispatch:      # 支持手动触发

env:
  UPSTREAM_REPO: THU-MAIC/OpenMAIC
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream latest release
        id: check
        run: |
          # 获取上游最新正式 release（排除 pre-release）
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name')
          
          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" = "null" ]; then
            echo "No latest release found"
            exit 1
          fi
          
          echo "Latest upstream release: $LATEST_RELEASE"
          echo "latest_tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          
          # 检查本地是否已有这个 tag
          if git rev-parse "$LATEST_RELEASE" >/dev/null 2>&1; then
            echo "Tag $LATEST_RELEASE already exists locally, no action needed"
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release detected: $LATEST_RELEASE"
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync upstream tag to fork
        if: steps.check.outputs.new_release == 'true'
        run: |
          git remote add upstream https://github.com/$UPSTREAM_REPO.git
          git fetch upstream tag ${{ steps.check.outputs.latest_tag }}
          git push origin tag ${{ steps.check.outputs.latest_tag }}
          echo "Successfully pushed tag ${{ steps.check.outputs.latest_tag }} to fork"

  build-docker:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-sync.outputs.latest_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-and-sync.outputs.latest_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Docker image built and pushed!"
          echo ""
          echo "Image tags:"
          echo "- ${{ env.IMAGE_NAME }}:latest"
          echo "- ${{ env.IMAGE_NAME }}:${{ needs.check-and-sync.outputs.latest_tag }}"
          echo ""
          echo "Pull command:"
          echo "\`\`\`bash"
          echo "docker pull ${{ env.IMAGE_NAME }}:latest"
          echo "\`\`\`"
